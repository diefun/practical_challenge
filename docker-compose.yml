services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/contractor-demo
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p contractor-demo 'RETURN 1' || exit 1"]
      interval: 5s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.2
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  # Action layer: the only component with write access. Separate process from the agent.
  mcp-server:
    build: { context: ., dockerfile: mcp_server/Dockerfile }
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: contractor-demo
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
    ports: ["8000:8000"]
    depends_on:
      neo4j: { condition: service_healthy }

volumes:
  neo4j_data:
  qdrant_data:
